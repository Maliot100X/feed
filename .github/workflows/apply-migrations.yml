name: Apply database migrations

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Apply reviewed SQL migrations to this environment
        type: choice
        required: true
        options: [staging, production]

concurrency:
  group: database-migrations-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    if: github.ref_name == inputs.environment
    runs-on: ubuntu-latest
    environment: cloudflare-${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Validate migration journal before connecting to the database
        run: bun scripts/cloudflare/check-migration-history.ts
      - name: Apply checked-in migrations
        env:
          DATABASE_URL: ${{ inputs.environment == 'production' && secrets.PROD_DATABASE_URL || secrets.STAGING_DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ inputs.environment == 'production' && secrets.PROD_DIRECT_DATABASE_URL || secrets.STAGING_DIRECT_DATABASE_URL }}
          # Railway's per-service CA; the pg driver verifies the chain via
          # `?uselibpqcompat=true&sslmode=verify-ca&sslrootcert=$RUNNER_TEMP/database-ca.pem`.
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
        run: |
          test -n "$DATABASE_URL"
          test -n "$DIRECT_DATABASE_URL"
          test -n "$DATABASE_CA_CERT"
          printf '%s\n' "$DATABASE_CA_CERT" > "$RUNNER_TEMP/database-ca.pem"
          DIRECT_DATABASE_URL="${DIRECT_DATABASE_URL//\$RUNNER_TEMP/$RUNNER_TEMP}" bun run db:migrate
