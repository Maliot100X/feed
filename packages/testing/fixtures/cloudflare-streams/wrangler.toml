name = "feed-streams-local-test"
main = "worker.ts"
compatibility_date = "2026-10-10"
compatibility_flags = ["nodejs_compat", "enable_request_signal", "request_signal_passthrough"]

[[durable_objects.bindings]]
name = "STREAMS"
class_name = "FeedStreams"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FeedStreams"]


[[durable_objects.bindings]]
name = "RATE_LIMITS"
class_name = "FeedRateLimits"

[[durable_objects.bindings]]
name = "DEVICES"
class_name = "FeedDevices"

[[durable_objects.bindings]]
name = "PAYMENTS"
class_name = "FeedPayments"

[[durable_objects.bindings]]
name = "API_KEY_USAGE"
class_name = "FeedApiKeyUsage"

[[durable_objects.bindings]]
name = "ORG_COORDINATION"
class_name = "FeedOrgCoordination"

[[durable_objects.bindings]]
name = "ALERT_RESERVATIONS"
class_name = "FeedAlertReservations"

[[durable_objects.bindings]]
name = "TASKS"
class_name = "FeedTasks"

[[durable_objects.bindings]]
name = "CACHE"
class_name = "FeedCache"

[[migrations]]
tag = "health-v1"
new_sqlite_classes = ["FeedRateLimits", "FeedDevices", "FeedPayments", "FeedApiKeyUsage", "FeedOrgCoordination", "FeedAlertReservations", "FeedTasks", "FeedCache"]
