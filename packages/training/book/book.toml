[book]
title = "Feed RL Training Pipeline"
authors = ["revlentless"]
language = "en"
src = "src"

[build]
build-dir = "book"
# Fail the build on broken SUMMARY links instead of generating empty pages.
create-missing = false

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/feedforagents/feed"
edit-url-template = "https://github.com/feedforagents/feed/edit/staging/packages/training/book/src/{path}"
site-url = "/"
cname = ""
no-section-label = false
additional-js = ["mermaid.min.js", "mermaid-init.js"]

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
boost-hierarchy = 2

[output.html.playground]
editable = false
copyable = true
copy-js = true
line-numbers = true
